name: PR title

# Releases are computed from commit messages, and squash-merges use the PR title
# as the commit message, so PR titles must follow Conventional Commits.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Reads only the PR title via the API; never checks out PR code.
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            deps
            docs
            refactor
            style
            test
            build
            ci
            chore
          requireScope: false
