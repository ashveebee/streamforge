services:
  streamforge:
    # Pin a major version (":1") for automatic minor/patch updates without
    # breaking changes, or an exact version (":1.2.3") for full control.
    image: ghcr.io/ashveebee/streamforge:1
    container_name: streamforge
    env_file: .env
    ports:
      - "4000:4000"
    volumes:
      # Mount storage read-only if you use INFINIDISK_MOUNTS for local stats.
      - /mnt/media:/mnt/media:ro
    # For host-level network stats, use host networking instead of ports:
    # network_mode: host
    restart: unless-stopped
