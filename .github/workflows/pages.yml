name: Website

# Publishes the project website (site/) to GitHub Pages, together with the
# README screenshots and the guides (docs/guides, built into site/guides),
# whenever any of them changes on main.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/screenshots/**
      - docs/guides/**
      - scripts/build-guides.mjs
      - public/favicon.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      # Only the guide builder's Markdown converter is needed; no app build.
      - run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Assemble site
        run: |
          mkdir -p _site/screenshots
          cp -R site/. _site/
          cp docs/screenshots/*.jpg _site/screenshots/
          cp public/favicon.svg _site/favicon.svg
          node scripts/build-guides.mjs _site/guides
          touch _site/.nojekyll

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
