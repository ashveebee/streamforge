services:
  streamforge:
    # "latest" follows every stable release. Pin an exact version (":0.3.1")
    # for full control, or a major version (":1") once 1.0 is out.
    image: ghcr.io/ashveebee/streamforge:latest
    container_name: streamforge
    # Optional: services are normally configured from the Settings page.
    env_file:
      - path: .env
        required: false
    ports:
      - "4000:4000"
    volumes:
      # Settings saved from the UI (SQLite). Keep this so they survive upgrades.
      - streamforge-data:/data
      # Optional: mount storage read-only to measure it under Settings →
      # Infinidisk → Advanced → Local mount paths.
      # - /mnt/media:/mnt/media:ro
      # Optional: Kometa's config folder, read-write, to make collections from
      # the Kometa page (Settings → Kometa → Collections from StreamForge).
      # - /opt/kometa/config:/kometa
    # For host-level network stats, or to find Jellyfin, Emby and Plex servers on
    # your network (Settings → Jellyfin → Find on network), use host networking
    # instead of ports:
    # network_mode: host
    restart: unless-stopped

volumes:
  streamforge-data:
